# Reaction Core on your own server: the app (dist/) plus map data kept outside the build.
#   /srv/reaction/app    ← contents of dist/ after `npm run build`
#   /srv/reaction/tiles  ← node scripts/maps/fetch-basemap.mjs --out /srv/reaction/tiles
#                          node scripts/maps/build-terrain.mjs  --out /srv/reaction/tiles/terrain
# Serve it only inside your VPN or behind your SSO proxy: the app itself has no server-side login yet.
server {
    listen 443 ssl http2;
    server_name core.example.internal;

    ssl_certificate     /etc/ssl/reaction/fullchain.pem;
    ssl_certificate_key /etc/ssl/reaction/privkey.pem;

    root /srv/reaction/app;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Map data. PMTiles is read with HTTP range requests, which nginx serves natively for static files.
    location /tiles/ {
        alias /srv/reaction/tiles/;
        types { application/octet-stream pmtiles; image/webp webp; application/x-protobuf pbf; application/json json; }
        add_header Cache-Control "public, max-age=86400";
        gzip off;             # tiles are already compressed; gzip would break range requests
    }
    location = /tiles/manifest.json {
        alias /srv/reaction/tiles/manifest.json;
        add_header Cache-Control "no-cache";
    }

    # Conflict data refreshed by scripts/update-conflicts.mjs.
    location /data/conflicts/ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
